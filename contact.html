	<div class="container">
	<section class="page-header">
	<h2>Contact Me</h2>
	<p>
	Have a question or want to work with me?
	Send me a message.
	</p>
	</section>
	<section class="contact">
	<h2>Send a Message</h2>
	<form action="https://formspree.io/f/xdeoyvwn" method="POST"> 
	<div class="form-group">
	<label for="name">Your Name</label>
	<input type="text"id="name"name"name"placeholder="Enter your name"required>
	</div>
	<div class="form-group">
	<label for="email">Email Address</label>
	<input type="email"id="email"name="email"placeholder="Enter your email"required>
	</div>
	<div class="form-group">
	<label for="phone">Phone Number</label>
	<input type="tel"id="phone"name="phone"placeholder="Enter your phone number">
	</div>
	<div class="form-group">
	<label for="subject">Subject</label>
	<input type="text"id="subject"name="subject"placeholder="Enter your subject" required>
	</div>
	<div class="form-group">
	<label for="message">Your Message</label>
	<textarea id="message"name="message"rows="5"placeholder="Write your message here..."required>
	</textarea>
	</div>
	<button type="submit"class="btn">
	Send Message
	</button>
	</form>
	</section>
	</div>
